name: Language browser audit (isolated)
on:
  push:
    branches: [language-testing]
    paths:
      - 'tests/language_audit.py'
      - 'tests/patch_v277_language.py'
      - '.github/workflows/language-audit.yml'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/patch_v277_language.py
      - run: TEST_HTML=index-language-fixed.html python tests/language_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: language-audit-report
          path: language-test-results/
