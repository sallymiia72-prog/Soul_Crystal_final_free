name: Full language browser audit (RU UA EN)
on:
  push:
    branches: [language-testing]
    paths:
      - 'tests/language_audit.py'
      - 'tests/content_language_audit.py'
      - 'tests/locale_regressions.py'
      - 'tests/patch_result_group_locale.py'
      - 'tests/activator_sections_audit.py'
      - 'tests/activator_journey_audit.py'
      - 'tests/patch_v277_language.py'
      - 'tests/visual_mobile_audit.py'
      - '.github/workflows/language-audit.yml'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/patch_v277_language.py
      - run: python tests/patch_result_group_locale.py
      - run: TEST_HTML=index-language-fixed.html python tests/language_audit.py
      - run: TEST_HTML=index-language-fixed.html python tests/activator_sections_audit.py
      - run: TEST_HTML=index-language-fixed.html python tests/activator_journey_audit.py
      - run: TEST_HTML=index-language-fixed.html python tests/locale_regressions.py
      - run: TEST_HTML=index-language-fixed.html python tests/content_language_audit.py
      - run: python tests/visual_mobile_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: language-audit-report
          path: |
            content-language-results/
            language-test-results/
            activator-test-results/
            activator-journey-results/
            visual-audit-results/
