name: Apply Monobank integration

on:
  push:
    branches:
      - monobank-integration
    paths:
      - .github/workflows/apply-monobank.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: monobank-integration
          fetch-depth: 0

      - name: Apply verified payment patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check monobank-index.patch
          git apply monobank-index.patch
          rm -f monobank-index.patch
          rm -f .github/workflows/apply-monobank.yml
          git config user.name "Soul Crystal Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Monobank payments"
          git push origin HEAD:monobank-integration
