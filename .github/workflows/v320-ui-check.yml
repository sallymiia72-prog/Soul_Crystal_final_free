name: V320 mobile buttons and formula gate
on:
  push:
    branches: [language-testing]
    paths: ['.github/workflows/v320-ui-check.yml', 'index.html']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Test mobile layout and unpaid activation
        run: |
          cat > /tmp/check.py <<'PY'
          import asyncio, json, threading
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from playwright.async_api import async_playwright
          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self,*a): pass
          async def main():
              server=ThreadingHTTPServer(('127.0.0.1',0),Quiet)
              threading.Thread(target=server.serve_forever,daemon=True).start()
              results={}
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True,args=['--no-sandbox'])
                  page=await browser.new_page(viewport={'width':390,'height':844},device_scale_factor=1)
                  try:
                      await page.goto(f'http://127.0.0.1:{server.server_port}/index.html',wait_until='domcontentloaded',timeout=120000)
                      await page.wait_for_timeout(2500)
                      selectors=['#scToolsGroup > article.report-offer > button.next-offer-toggle','#v72CodeActivationToggle','#higherSelfRevealToggle','#mandalaOffer > button.next-offer-toggle','#soulMeditationOffer > button.next-offer-toggle']
                      results['buttons']=await page.evaluate("""sels=>sels.map(sel=>{let e=document.querySelector(sel);if(!e)return {selector:sel,missing:true};let r=e.getBoundingClientRect();let text=e.querySelector('.next-offer-title,.title')||e;let t=text.getBoundingClientRect();return {selector:sel,height:Math.round(r.height),width:Math.round(r.width),titleTop:Math.round(t.top-r.top),titleBottom:Math.round(t.bottom-r.top),text:text.textContent.trim().slice(0,80)}})""",selectors)
                      await page.locator('#activatorOpenButton').click(timeout=12000)
                      await page.wait_for_timeout(1200)
                      results['afterOpen']=await page.evaluate("""()=>{let e=document.querySelector('#activator');return {display:getComputedStyle(e).display,visible:e.getBoundingClientRect().height>0}}""")
                      await page.locator('button.sc-main-group-tools[data-target="scToolsGroup"]').click(timeout=12000)
                      await page.wait_for_timeout(900)
                      results['buttons']=await page.evaluate("""()=>['#scToolsGroup > article.report-offer > button.next-offer-toggle','#v72CodeActivationToggle','#higherSelfRevealToggle','#mandalaOffer > button.next-offer-toggle','#soulMeditationOffer > button.next-offer-toggle'].map(sel=>{let e=document.querySelector(sel);let r=e?.getBoundingClientRect();return {selector:sel,height:Math.round(r?.height||0),width:Math.round(r?.width||0)}})""")
                      await page.locator('#v72CodeActivationToggle').click(timeout=12000)
                      await page.wait_for_timeout(1000)
                      results['gate']=await page.evaluate("""()=>{let c=document.querySelector('#v72CodeActivationContent'),b=document.querySelector('#v144CodePay'),player=c?.querySelector('.sc-act-player');let vis=e=>!!e&&getComputedStyle(e).display!=='none'&&getComputedStyle(e).visibility!=='hidden'&&e.getBoundingClientRect().height>0;return {buttonExists:!!b,buttonVisible:vis(b),buttonText:b?.textContent,playerVisible:vis(player),access:localStorage.getItem('soul_paid_entitlements_v144_live')}}""")
                      print(json.dumps(results,ensure_ascii=False,indent=2))
                      with open('v320-diagnostic.json','w') as f: json.dump(results,f,ensure_ascii=False,indent=2)
                      async def mock_payment(route):
                          req=route.request
                          if req.method=='POST':
                              results['paymentPost']=json.loads(req.post_data or '{}')
                              await route.fulfill(status=200,content_type='application/json',body=json.dumps({'invoiceId':'test_invoice_123456','pageUrl':'https://example.com/fake-mono-checkout'}))
                          else:
                              results['paymentStatusRequested']=True
                              await route.fulfill(status=200,content_type='application/json',body=json.dumps({'invoiceId':'test_invoice_123456','status':'success','paid':True,'productId':'formula'}))
                      await page.route('https://soulcrystal.store/api/payment*',mock_payment)
                      await page.locator('#v144CodePay').click(timeout=10000)
                      await page.wait_for_timeout(800)
                      results['pendingAfterClick']=await page.evaluate("""()=>localStorage.getItem('soul_pending_invoice_v1')""")
                      await page.evaluate("""()=>{window.dispatchEvent(new Event('focus'))}""")
                      await page.wait_for_timeout(1700)
                      results['afterSimulatedPayment']=await page.evaluate("""()=>{let c=document.querySelector('#v72CodeActivationContent'),h=c?.querySelector('.host'),b=document.querySelector('#v144CodePay'),vis=e=>!!e&&getComputedStyle(e).display!=='none'&&e.getBoundingClientRect().height>0;return {access:localStorage.getItem('soul_paid_entitlements_v144_live'),hostVisible:vis(h),payVisible:vis(b)}}""")
                      with open('v320-payment-test.json','w') as f: json.dump(results,f,ensure_ascii=False,indent=2)
                      print('SIMULATED_PAYMENT_RESULT',json.dumps(results,ensure_ascii=False))
                      assert results.get('paymentPost',{}).get('productId')=='formula', 'Wrong payment product'
                      assert results['afterSimulatedPayment']['hostVisible'], 'Player host did not unlock after verified mock success'
                      assert not results['afterSimulatedPayment']['payVisible'], 'Payment button still visible after mock success'
                      await page.screenshot(path='v320-mobile.png',full_page=True,timeout=120000)
                      print(json.dumps(results,ensure_ascii=False,indent=2))
                      with open('v320-diagnostic.json','w') as f: json.dump(results,f,ensure_ascii=False,indent=2)
                      assert results['gate']['buttonVisible'], 'Payment button not visible after opening activation'
                      assert not results['gate']['playerVisible'], 'Activation player visible without payment'
                      heights=[b['height'] for b in results['buttons'] if not b.get('missing')]
                      assert len(heights)==5 and max(heights)-min(heights)<=2, 'Buttons have different heights'
                  finally:
                      await browser.close()
                      server.shutdown()
          asyncio.run(main())
          PY
          python /tmp/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v320-mobile-screenshot
          path: v320-mobile.png
      - name: Save diagnostic report in test branch
        if: always()
        run: |
          if test -f v320-diagnostic.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            mkdir -p tests/results
            cp v320-diagnostic.json tests/results/v320-diagnostic.json
            if test -f v320-payment-test.json; then cp v320-payment-test.json tests/results/v320-payment-test.json; fi
            git add tests/results/v320-diagnostic.json tests/results/v320-payment-test.json
            git diff --cached --quiet || (git commit -m "Record V320 Chromium diagnostic results" && git push origin HEAD:language-testing)
          fi
